# ==============================================================================
# EXTENSION CONFIGURATION
# ==============================================================================
# Configuration file to build the manifest.json for Chrome, Edge, and Firefox. The build script (scripts/build.mjs) reads this file and applies browser-specific overrides.

# ─── 1. Extension Metadata
# Core extension properties shared by all browsers.
manifest_version = 3
name = "Correios Wizard"
description = "Conjunto de ferramentas internas para otimizar tarefas operacionais nos Correios"
author = "Henrique Moreira"
homepage_url = "https://github.com/henrique-coder/correios-wizard"

# ─── 2. Internal Versioning
# Dynamic version injected at build time via regex placeholders: {{yyyy}} (year), {{m}} (month), {{d}} (day), {{n}} (daily build counter). Example: "2026.3.30.0".
version = "{{yyyy}}.{{m}}.{{d}}.{{n}}"

# ─── 3. Permissions
# Required WebExtension API permissions.
permissions = []

# ─── 4. Host Permissions
# Allowed domains for extension interaction. Restricted to Correios subdomains for security.
host_permissions = ["*://*.correios.com.br/*"]

# ─── 5. UI Assets: Icons
# Relative paths to extension icons by resolution in pixels.
[icons]
"16" = "icons/icon16.png"
"32" = "icons/icon32.png"
"48" = "icons/icon48.png"
"128" = "icons/icon128.png"

# ─── 6. Action (Toolbar Button)
# Browser action button configuration.
[action]
default_title = "Correios Wizard"
default_icon = { "16" = "icons/icon16.png", "32" = "icons/icon32.png", "48" = "icons/icon48.png" }

# ─── 7. Content Scripts
# Scripts injected into matching URLs. Executes at 'document_start' in the top window only.
[[content_scripts]]
matches = [
  "*://sroweb.correios.com.br/app/entregaexternaautomatica/lancamentoautomatico/*",
  "*://sroweb.correios.com.br/app/entregaexternaautomatica/loecsuspensa/*"
]
js = ["browser-polyfill.min.js", "content.js"]
run_at = "document_start"
all_frames = false

# ─── 8. Web Accessible Resources
# Resources exposed to the web page context, required for XHR and fetch interceptions by injected.js.
[[web_accessible_resources]]
resources = ["injected.js"]
matches = ["*://*.correios.com.br/*"]

# ==============================================================================
# BROWSER-SPECIFIC OVERRIDES
# ==============================================================================
# Parameters to merge or replace global fields during the build phase based on the target browser.

# ─── CHROME
[browser_overrides.chrome]
minimum_chrome_version = "102"

[browser_overrides.chrome.background]
service_worker = "background.js"

# ─── EDGE
[browser_overrides.edge]
minimum_chrome_version = "102"

[browser_overrides.edge.background]
service_worker = "background.js"

# ─── FIREFOX
# Firefox MV3 requires background scripts instead of a service worker, and a browser_specific_settings block for extension ID and updates.
[browser_overrides.firefox.background]
scripts = ["background.js"]

[browser_overrides.firefox.browser_specific_settings.gecko]
id = "@correios-wizard.henriquecoder"
strict_min_version = "121.0"
update_url = "https://github.com/henrique-coder/correios-wizard/releases/latest/download/firefox_updates.json"
