name: Release Browser Extensions

on:
  push:
    branches:
      - prod
    paths:
      - ".github/workflows/release-browser-extensions.yml"
      - "extensions/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-browser-extensions
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate Extensions
        run: |
          echo "🔎 Validating JavaScript and JSON files..."
          ERROR=0

          # Check JS syntax
          find extensions -name "*.js" -print0 | while IFS= read -r -d '' file; do
             if ! node --check "$file" >/dev/null 2>&1; then
               echo "❌ Invalid JavaScript: $file"
               node --check "$file" || true
               ERROR=1
             fi
          done

          # Check JSON syntax
          find extensions -name "*.json" -print0 | while IFS= read -r -d '' file; do
             if ! jq . "$file" >/dev/null 2>&1; then
               echo "❌ Invalid JSON: $file"
               ERROR=1
             fi
          done

          if [ $ERROR -eq 1 ]; then
            echo "⛔ Validation failed. Release cancelled."
            exit 1
          fi

          echo "✅ All files are valid."

      - name: Install Minification Tools
        run: npm install -g html-minifier-terser terser csso-cli

      - name: Process Extensions
        id: process
        run: |
          mkdir -p release_assets
          STATS_FILE=$(mktemp)

          LATEST_MODIFIED="None"
          LATEST_TIMESTAMP=0

          echo "🔄 Processing extensions..."

          for dir in extensions/*/; do
            if [ -d "$dir" ]; then
              ext_name=$(basename "$dir")
              echo "  - Processing $ext_name..."

              temp_dir=$(mktemp -d)
              cp -r "$dir"* "$temp_dir/"

              find "$temp_dir" -name "*.html" -type f | while read file; do
                html-minifier-terser --collapse-whitespace --remove-comments --minify-css true --minify-js true -o "$file" "$file" 2>/dev/null || true
              done

              find "$temp_dir" -name "*.js" -type f | while read file; do
                terser "$file" --compress --mangle --output "$file" 2>/dev/null || true
              done

              find "$temp_dir" -name "*.css" -type f | while read file; do
                csso "$file" --output "$file" 2>/dev/null || true
              done

              find "$temp_dir" -name "*.json" -type f | while read file; do
                jq -c '.' "$file" > "$file.tmp" && mv "$file.tmp" "$file" 2>/dev/null || true
              done

              cd "$temp_dir"
              zip_name="${ext_name}.zip"
              zip -9 -r "$GITHUB_WORKSPACE/release_assets/$zip_name" .
              cd "$GITHUB_WORKSPACE"

              file_size=$(du -h "release_assets/$zip_name" | cut -f1)

              last_mod=$(git log -1 --format=%ct -- "$dir")
              if [ -z "$last_mod" ]; then last_mod=0; fi

              if [ "$last_mod" -gt "$LATEST_TIMESTAMP" ]; then
                LATEST_TIMESTAMP=$last_mod
                LATEST_MODIFIED=$ext_name
              fi

              echo "| \`$zip_name\` | $file_size |" >> "$STATS_FILE"
              rm -rf "$temp_dir"
            fi
          done

          echo "latest_item=$LATEST_MODIFIED" >> $GITHUB_OUTPUT

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "### 🚀 Release Information" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Latest Update:** \`$LATEST_MODIFIED\`" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "| Extension | Size |" >> $GITHUB_OUTPUT
          echo "| :--- | :--- |" >> $GITHUB_OUTPUT
          cat "$STATS_FILE" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Commit:** [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Delete Existing Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete browser-extensions --cleanup-tag -y 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: browser-extensions
          name: "Browser Extensions"
          body: ${{ steps.process.outputs.body }}
          files: release_assets/*.zip
          draft: false
          prerelease: false
          make_latest: true
