name: Release Browser Extensions

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/release-browser-extensions.yml"
      - "extensions/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-browser-extensions
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect changed extensions
        id: changed-extensions
        run: |
          extensions=$(find extensions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          changed_extensions=""

          if [ -z "$(git rev-parse HEAD^ 2>/dev/null)" ]; then
            changed_extensions="$extensions"
            echo "First commit detected, processing all extensions"
          else
            for ext in $extensions; do
              if git diff --name-only HEAD^ HEAD | grep -q "^extensions/$ext/"; then
                changed_extensions="$changed_extensions $ext"
                echo "Detected changes in: $ext"
              fi
            done
          fi

          changed_extensions=$(echo "$changed_extensions" | xargs)
          echo "extensions=$changed_extensions" >> $GITHUB_OUTPUT

      - name: Create ZIP archives
        if: steps.changed-extensions.outputs.extensions != ''
        run: |
          mkdir -p release_assets

          IFS=' ' read -ra EXTENSIONS <<< "${{ steps.changed-extensions.outputs.extensions }}"
          for ext in "${EXTENSIONS[@]}"; do
            echo "Creating ZIP for: $ext"
            cd "extensions/$ext"
            zip -9 -r "../../release_assets/${ext}.zip" .
            cd ../..
            echo "✓ Created ${ext}.zip"
          done

          ls -lh release_assets/

      - name: Upload to release
        if: steps.changed-extensions.outputs.extensions != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: browser-extensions
          name: Browser Extensions
          body: |
            ## Browser Extensions - Automated Release

            Zipped versions of all browser extensions, automatically updated on commit.

            **Updated:** ${{ github.event.head_commit.timestamp }}
            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            ---
            *Maintained by GitHub Actions*
          files: release_assets/*.zip
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.changed-extensions.outputs.extensions != ''
        run: |
          echo "### ✅ Release Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Extensions:**" >> $GITHUB_STEP_SUMMARY

          IFS=' ' read -ra EXTENSIONS <<< "${{ steps.changed-extensions.outputs.extensions }}"
          for ext in "${EXTENSIONS[@]}"; do
            size=$(du -h "release_assets/${ext}.zip" | cut -f1)
            echo "- \`${ext}.zip\` (${size})" >> $GITHUB_STEP_SUMMARY
          done
