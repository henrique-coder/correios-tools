name: Deploy to GitHub Pages

on:
  push:
    branches:
      - prod
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "src/powershell/**"
      - "src/extensions/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install PSMinifier
        shell: pwsh
        run: Install-Module PSMinifier -Force -Scope CurrentUser

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Build and Hash
        shell: pwsh
        run: |
          mkdir -p public/script/hashes
          mkdir -p public/script/version
          mkdir -p public/extension/version

          function Get-GitFileDate {
              param($FilePath)
              $date = git log -1 --format="%cd" --date=format:"%Y/%m/%d-%H:%M:%S" $FilePath
              if (-not $date) {
                  $date = Get-Date -Format "yyyy/MM/dd-HH:mm:ss"
              }
              return $date
          }

          $scripts = Get-ChildItem "src/powershell/*.ps1"
          foreach ($script in $scripts) {
              $version = Get-GitFileDate $script.FullName

              $content = Get-Content $script.FullName -Raw
              $content = $content -replace "\{\{VERSION\}\}", $version

              $minified = Compress-ScriptBlock -ScriptBlock ([ScriptBlock]::Create($content))

              $outPath = "public/script/$($script.Name)"
              [System.IO.File]::WriteAllText($outPath, $minified.ToString(), [System.Text.UTF8Encoding]::new($false))

              $versionJson = @{ version = $version } | ConvertTo-Json -Compress
              $versionOutPath = "public/script/version/$($script.Name).json"
              [System.IO.File]::WriteAllText($versionOutPath, $versionJson, [System.Text.UTF8Encoding]::new($false))
          }

          $extVersion = Get-GitFileDate "src/extensions/correios-tools"
          $extVersionJson = @{ version = $extVersion } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText("public/extension/version/correios-tools.json", $extVersionJson, [System.Text.UTF8Encoding]::new($false))

          Push-Location "src/extensions/correios-tools"
          7z a -tzip -mx=9 "../../../public/extension/correios-tools.zip" *
          Pop-Location

          $hashScript = @"
          import hashlib
          import glob
          import os
          import orjson
          import blake3
          from Crypto.Hash import SHA3_256, BLAKE2s, BLAKE2b

          def calculate_hashes(filepath):
              with open(filepath, 'rb') as f:
                  data = f.read()

              hashes = {}
              hashes['sha256'] = hashlib.sha256(data).hexdigest()
              hashes['sha512'] = hashlib.sha512(data).hexdigest()
              hashes['md5'] = hashlib.md5(data).hexdigest()
              hashes['blake2'] = hashlib.blake2b(data).hexdigest()
              hashes['blake3'] = blake3.blake3(data).hexdigest()
              hashes['sha3'] = hashlib.sha3_256(data).hexdigest()

              return hashes

          if __name__ == '__main__':
              files = glob.glob('public/script/*.ps1') + glob.glob('public/extension/*.zip')
              for f in files:
                  h = calculate_hashes(f)
                  name = os.path.basename(f)

                  if f.endswith('.zip'):
                      os.makedirs('public/extension/hashes', exist_ok=True)
                      with open(f'public/extension/hashes/{name}.json', 'wb') as json_file:
                          json_file.write(orjson.dumps(h))
                  else:
                      with open(f'public/script/hashes/{name}.json', 'wb') as json_file:
                          json_file.write(orjson.dumps(h))
          "@

          [System.IO.File]::WriteAllText("hasher.py", $hashScript, [System.Text.UTF8Encoding]::new($false))

          uv run --python 3.14 --with pycryptodome --with orjson --with blake3 python hasher.py

          $html = @"
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=https://github.com/henrique-coder/correios-tools">
              <script>window.location.replace("https://github.com/henrique-coder/correios-tools");</script>
              <title>Redirecting...</title>
            </head>
            <body></body>
          </html>
          "@
          $html | Out-File public/index.html -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
