name: Deploy to GitHub Pages

on:
  push:
    branches:
      - prod
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "src/powershell/**"
      - "src/extensions/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install PSMinifier
        shell: pwsh
        run: Install-Module PSMinifier -Force -Scope CurrentUser

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Build and Hash
        shell: pwsh
        run: |
          mkdir -p public/script/hashes
          mkdir -p public/script/version
          mkdir -p public/extension/version

          function Get-GitFileDate {
              param($FilePath)
              $date = git log -1 --format="%cd" --date=format:"%Y/%m/%d-%H:%M:%S" $FilePath
              if (-not $date) {
                  $date = Get-Date -Format "yyyy/MM/dd-HH:mm:ss"
              }
              return $date
          }

          $scripts = Get-ChildItem "src/powershell/*.ps1"
          foreach ($script in $scripts) {
              $version = Get-GitFileDate $script.FullName

              $content = Get-Content $script.FullName -Raw
              $content = $content -replace "\{\{VERSION\}\}", $version

              $minified = Compress-ScriptBlock -ScriptBlock ([ScriptBlock]::Create($content))

              $outPath = "public/script/$($script.Name)"
              [System.IO.File]::WriteAllText($outPath, $minified.ToString(), [System.Text.UTF8Encoding]::new($false))

              $versionJson = @{ version = $version } | ConvertTo-Json -Compress
              $versionOutPath = "public/script/version/$($script.Name).json"
              [System.IO.File]::WriteAllText($versionOutPath, $versionJson, [System.Text.UTF8Encoding]::new($false))
          }

          $extVersion = Get-GitFileDate "src/extensions/correios-tools"
          $extVersionJson = @{ version = $extVersion } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText("public/extension/version/correios-tools.json", $extVersionJson, [System.Text.UTF8Encoding]::new($false))

          Push-Location "src/extensions/correios-tools"
          7z a -tzip -mx=9 "../../../public/extension/correios-tools.zip" *
          Pop-Location

          $hashScript = @"
          import hashlib
          import glob
          import os
          import orjson
          import blake3
          from Crypto.Hash import SHA3_256, BLAKE2s, BLAKE2b

          def calculate_hashes(filepath):
              with open(filepath, 'rb') as f:
                  data = f.read()

              hashes = {}
              hashes['sha256'] = hashlib.sha256(data).hexdigest()
              hashes['sha512'] = hashlib.sha512(data).hexdigest()
              hashes['md5'] = hashlib.md5(data).hexdigest()
              hashes['blake2'] = hashlib.blake2b(data).hexdigest()
              hashes['blake3'] = blake3.blake3(data).hexdigest()
              hashes['sha3'] = hashlib.sha3_256(data).hexdigest()

              return hashes

          if __name__ == '__main__':
              files = glob.glob('public/script/*.ps1') + glob.glob('public/extension/*.zip')
              for f in files:
                  h = calculate_hashes(f)
                  name = os.path.basename(f)

                  if f.endswith('.zip'):
                      os.makedirs('public/extension/hashes', exist_ok=True)
                      with open(f'public/extension/hashes/{name}.json', 'wb') as json_file:
                          json_file.write(orjson.dumps(h))
                  else:
                      with open(f'public/script/hashes/{name}.json', 'wb') as json_file:
                          json_file.write(orjson.dumps(h))
          "@

          [System.IO.File]::WriteAllText("hasher.py", $hashScript, [System.Text.UTF8Encoding]::new($false))

          uv run --python 3.14 --with pycryptodome --with orjson --with blake3 python hasher.py

          $html = @"
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Correios Tools - Ferramentas de Produtividade</title>
              <style>
                  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; color: #333; line-height: 1.6; }
                  .container { max-width: 800px; margin: 40px auto; background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 5px solid #00416B; }
                  h1 { color: #00416B; margin-top: 0; }
                  h2 { color: #333; border-bottom: 2px solid #FFE600; display: inline-block; padding-bottom: 5px; margin-top: 30px; }
                  .tagline { font-size: 1.1em; color: #666; margin-bottom: 30px; }
                  .highlight { background-color: #e9ecef; padding: 15px; border-radius: 5px; border-left: 4px solid #00416B; margin: 20px 0; }
                  code { font-family: 'Consolas', 'Courier New', monospace; color: #d63384; word-break: break-all; }
                  .btn { display: inline-block; background-color: #00416B; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: bold; transition: background 0.2s; }
                  .btn:hover { background-color: #002a45; }
                  ul { list-style-type: none; padding: 0; }
                  li { margin-bottom: 10px; padding-left: 20px; position: relative; }
                  li:before { content: '✓'; color: #00b894; position: absolute; left: 0; font-weight: bold; }
                  footer { margin-top: 50px; font-size: 0.85em; color: #888; text-align: center; border-top: 1px solid #eee; padding-top: 20px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Correios Tools</h1>
                  <p class="tagline">Suíte de ferramentas open-source para otimização operacional e eficiência em triagem.</p>
                  
                  <div>
                      <h2>Sobre o Projeto</h2>
                      <p>O <strong>Correios Tools</strong> é um software desenvolvido para fins educacionais e profissionais, visando auxiliar colaboradores na execução de tarefas nos sistemas internos. A ferramenta foca na melhoria da ergonomia digital e na agilidade dos processos de lançamento.</p>
                  </div>

                  <div>
                      <h2>Segurança e Transparência</h2>
                      <ul>
                          <li><strong>Código Aberto (Open Source):</strong> Todo o código é auditável e está hospedado publicamente no GitHub.</li>
                          <li><strong>Execução Local:</strong> As automações rodam localmente no navegador do usuário, sem envio de dados sensíveis para servidores externos.</li>
                          <li><strong>Conformidade:</strong> Desenvolvido para auxiliar no fluxo de trabalho sem alterar as regras de negócio dos sistemas originais.</li>
                      </ul>
                  </div>

                  <div class="highlight">
                      <h3>Instalação</h3>
                      <p>Para utilizar a ferramenta, execute o seguinte comando no PowerShell:</p>
                      <code>irm https://henrique-coder.github.io/correios-tools/script/install.ps1 | iex</code>
                  </div>

                  <div style="margin-top: 30px;">
                      <a href="https://github.com/henrique-coder/correios-tools" class="btn">Acessar Repositório no GitHub</a>
                  </div>

                  <footer>
                      <p>Desenvolvido por Henrique Moreira - Jovem Aprendiz.</p>
                      <p>Projeto independente focado em eficiência e aprendizado técnico.</p>
                  </footer>
              </div>
          </body>
          </html>
          "@
          $html | Out-File public/index.html -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
