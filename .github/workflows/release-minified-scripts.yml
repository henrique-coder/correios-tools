name: Release Minified Scripts

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/release-minified-scripts.yml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-minified-scripts
  cancel-in-progress: true

jobs:
  minify-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check PowerShell version
        shell: pwsh
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"

      - name: Install PSMinifier
        shell: pwsh
        run: |
          Install-Module PSMinifier -Force -Scope CurrentUser
          Import-Module PSMinifier

      - name: Minify scripts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_assets | Out-Null

          $rootScripts = Get-ChildItem -Path "scripts" -Filter "*.ps1" -File
          $extraScripts = Get-ChildItem -Path "scripts/extras" -Filter "*.ps1" -File -ErrorAction SilentlyContinue

          $allScripts = @()
          if ($rootScripts) { $allScripts += $rootScripts }
          if ($extraScripts) { $allScripts += $extraScripts }

          $processedCount = 0
          $totalOriginal = 0
          $totalMinified = 0

          foreach ($script in $allScripts) {
            if ($script.Name.StartsWith(".")) { continue }

            Write-Host "`n----------------------------------------" -ForegroundColor Cyan
            Write-Host "Processing: $($script.Name)" -ForegroundColor Cyan

            try {
              $content = Get-Content $script.FullName -Raw
              $originalSize = $content.Length

              $minifiedBlock = Compress-ScriptBlock -ScriptBlock ([ScriptBlock]::Create($content))
              $minifiedContent = $minifiedBlock.ToString()
              $minifiedSize = $minifiedContent.Length

              $ratio = [math]::Round((1 - ($minifiedSize / $originalSize)) * 100, 2)

              Write-Host "Original: $originalSize bytes" -ForegroundColor Yellow
              Write-Host "Minified: $minifiedSize bytes" -ForegroundColor Green
              Write-Host "Saved: $ratio%" -ForegroundColor Green

              $fileName = $script.Name.Replace(".ps1", ".min.ps1")

              if ($script.DirectoryName.Replace("\", "/") -match "/extras$") {
                $fileName = "extra-$fileName"
                Write-Host "Type: Extra Utility" -ForegroundColor Magenta
              }

              $outputPath = Join-Path "release_assets" $fileName
              [System.IO.File]::WriteAllText($outputPath, $minifiedContent, [System.Text.UTF8Encoding]::new($false))

              $processedCount++
              $totalOriginal += $originalSize
              $totalMinified += $minifiedSize
            }
            catch {
              Write-Host "Error processing $($script.Name): $_" -ForegroundColor Red
            }
          }

          Write-Host "`n========================================" -ForegroundColor Cyan
          Write-Host "TOTAL: $processedCount scripts" -ForegroundColor Cyan
          if ($totalOriginal -gt 0) {
            $totalRatio = [math]::Round((1 - ($totalMinified / $totalOriginal)) * 100, 2)
            Write-Host "Compression: $totalRatio%" -ForegroundColor Green
          }

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: minified-scripts
          name: Minified Scripts
          body: |
            ## PowerShell Scripts - Minified

            Minified versions of all PowerShell scripts, automatically updated on commit.

            **Format:**
            - `*.min.ps1` - Standard scripts
            - `extra-*.min.ps1` - Utility scripts

            **Updated:** ${{ github.event.head_commit.timestamp }}
            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            ---
            *Maintained by GitHub Actions using PSMinifier*
          files: release_assets/*.ps1
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
