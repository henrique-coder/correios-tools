name: Release Minified Scripts

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/release-minified-scripts.yml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minify-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"

      - name: Install PSMinifier
        shell: pwsh
        run: |
          Write-Host "Installing PSMinifier module..."
          Install-Module PSMinifier -Force -Scope CurrentUser
          Import-Module PSMinifier
          Get-Command -Module PSMinifier

      - name: Detect changed scripts
        id: changed-scripts
        shell: bash
        run: |
          # Find scripts in root 'scripts/' folder (maxdepth 1), ignoring dotfiles
          root_scripts=$(find scripts -maxdepth 1 -name "*.ps1" ! -name ".*" 2>/dev/null)

          # Find scripts in 'scripts/extras/' folder (maxdepth 1), ignoring dotfiles
          extra_scripts=$(find scripts/extras -maxdepth 1 -name "*.ps1" ! -name ".*" 2>/dev/null)

          # Merge lists, sort, and remove duplicates
          all_allowed_scripts=$(echo "$root_scripts $extra_scripts" | tr ' ' '\n' | sort | uniq)

          changed_scripts=""

          # Filter specifically for changed files within the allowed list
          for script in $all_allowed_scripts; do
            [ -z "$script" ] && continue

            if git diff --name-only HEAD^ HEAD | grep -q "^${script}$"; then
              changed_scripts="$changed_scripts $script"
              echo "Detected changes in: $script"
            fi
          done

          # Handle first commit or no history scenarios
          if [ -z "$(git rev-parse HEAD^ 2>/dev/null)" ]; then
            changed_scripts="$all_allowed_scripts"
            echo "First commit or no history detected, processing all allowed scripts"
          fi

          scripts_list=$(echo "$changed_scripts" | tr '\n' ' ')
          echo "scripts=$scripts_list" >> $GITHUB_OUTPUT

          if [ -z "$changed_scripts" ]; then
            echo "No relevant PowerShell scripts changed"
          fi

      - name: Minify PowerShell scripts
        if: steps.changed-scripts.outputs.scripts != ''
        shell: pwsh
        run: |
          Write-Host "Creating release assets directory..."
          New-Item -ItemType Directory -Force -Path release_assets | Out-Null

          $scriptsToProcess = "${{ steps.changed-scripts.outputs.scripts }}".Trim() -split '\s+'
          $processedCount = 0
          $totalOriginalSize = 0
          $totalMinifiedSize = 0

          foreach ($scriptPath in $scriptsToProcess) {
            if ([string]::IsNullOrWhiteSpace($scriptPath)) { continue }

            Write-Host "`n========================================" -ForegroundColor Cyan
            Write-Host "Processing: $scriptPath" -ForegroundColor Cyan
            Write-Host "========================================" -ForegroundColor Cyan

            try {
              $originalContent = Get-Content $scriptPath -Raw
              $originalSize = $originalContent.Length

              Write-Host "Minifying and removing comments..." -ForegroundColor Yellow
              # Compress-ScriptBlock natively removes comments and whitespace
              $minified = Compress-ScriptBlock -ScriptBlock ([ScriptBlock]::Create($originalContent))
              $minifiedContent = $minified.ToString()
              $minifiedSize = $minifiedContent.Length

              $compressionPercent = [math]::Round((1 - ($minifiedSize / $originalSize)) * 100, 2)

              Write-Host "✓ Original size: $originalSize bytes" -ForegroundColor Green
              Write-Host "✓ Minified size: $minifiedSize bytes" -ForegroundColor Green
              Write-Host "✓ Compression: $compressionPercent%" -ForegroundColor Green

              # Naming logic
              $fileName = [System.IO.Path]::GetFileNameWithoutExtension($scriptPath)
              $finalName = ""

              # Normalize path separators for consistency
              $normalizedPath = $scriptPath -replace '\\', '/'

              # Apply 'extra-' prefix if script is in 'scripts/extras/'
              if ($normalizedPath -match '^scripts/extras/') {
                  $finalName = "extra-${fileName}.min.ps1"
                  Write-Host "ℹ Applied 'extra-' prefix" -ForegroundColor Blue
              } else {
                  $finalName = "${fileName}.min.ps1"
              }

              # Save flatly to release_assets
              $minPs1Path = Join-Path "release_assets" $finalName

              [System.IO.File]::WriteAllText($minPs1Path, $minifiedContent, [System.Text.UTF8Encoding]::new($false))

              Write-Host "✓ Created: $minPs1Path" -ForegroundColor Green

              $processedCount++
              $totalOriginalSize += $originalSize
              $totalMinifiedSize += $minifiedSize
            } catch {
              Write-Host "✗ Failed to minify $scriptPath" -ForegroundColor Red
              Write-Host "Error: $_" -ForegroundColor Red
            }
          }

          Write-Host "`n========================================" -ForegroundColor Magenta
          Write-Host "Summary" -ForegroundColor Magenta
          Write-Host "========================================" -ForegroundColor Magenta
          Write-Host "Scripts processed: $processedCount" -ForegroundColor Cyan
          if ($totalOriginalSize -gt 0) {
            $totalCompression = [math]::Round((1 - ($totalMinifiedSize / $totalOriginalSize)) * 100, 2)
            Write-Host "Total compression: $totalCompression%" -ForegroundColor Green
          }

          Write-Host "`nGenerated files:" -ForegroundColor Yellow
          Get-ChildItem release_assets -File | ForEach-Object {
            Write-Host "  - $($_.Name)"
          }

      - name: Create or update release
        if: steps.changed-scripts.outputs.scripts != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: minified-scripts
          name: Minified Scripts
          body: |
            ## PowerShell Scripts - Minified Release

            This release contains minified versions of approved PowerShell scripts (comments and whitespace removed).

            **Format:**
            - `*.min.ps1` - Standard scripts
            - `extra-*.min.ps1` - Extra utility scripts

            **Last updated:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}

            ---
            *This release is automatically maintained by GitHub Actions using PSMinifier.*
          files: release_assets/*.ps1
          draft: false
          prerelease: false
          make_latest: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        if: steps.changed-scripts.outputs.scripts != ''
        shell: pwsh
        run: |
          Write-Output "### ✅ Minified Scripts Release Updated" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Output "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Output "**Scripts processed:**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-ChildItem release_assets -File | ForEach-Object {
            $size = [math]::Round($_.Length / 1KB, 2)
            Write-Output "- \`$($_.Name)\` ($size KB)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          Write-Output "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Output "**Release:** [Minified Scripts](${{ github.server_url }}/${{ github.repository }}/releases/tag/minified-scripts)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
