name: Deploy Extension

on:
  push:
    branches: [prod]
    paths:
      - "src/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate extension files
        run: |
          echo "Validating manifest.json..."
          node -e "JSON.parse(require('fs').readFileSync('src/manifest.json'))"

          echo "Validating JavaScript files..."
          for file in src/*.js; do
            node --check "$file" || exit 1
          done

          echo "All files valid!"

      - name: Install minification tools
        run: npm install -g terser@latest csso-cli@latest html-minifier-terser@latest

      - name: Generate dynamic version
        id: version
        run: |
          SP_DATE=$(TZ=America/Sao_Paulo date +'%Y-%-m-%-d')
          SP_YEAR=$(echo "$SP_DATE" | cut -d'-' -f1)
          SP_MONTH=$(echo "$SP_DATE" | cut -d'-' -f2)
          SP_DAY=$(echo "$SP_DATE" | cut -d'-' -f3)

          TODAY_START=$(TZ=America/Sao_Paulo date -d "$(TZ=America/Sao_Paulo date +%Y-%m-%d) 00:00:00" -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT_COUNT=$(git log --oneline --after="$TODAY_START" | wc -l)

          VERSION="${SP_YEAR}.${SP_MONTH}.${SP_DAY}.${COMMIT_COUNT}"
          echo "Generated version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('src/manifest.json'));
            manifest.version = '$VERSION';
            fs.writeFileSync('src/manifest.json', JSON.stringify(manifest, null, 2));
          "

      - name: Minify extension files
        run: |
          mkdir -p dist

          for file in src/*.js; do
            filename=$(basename "$file")
            if [ "$filename" = "browser-polyfill.min.js" ]; then
              cp "$file" "dist/$filename"
            else
              terser "$file" --compress --mangle --output "dist/$filename"
            fi
          done

          shopt -s nullglob
          for file in src/*.css; do
            filename=$(basename "$file")
            csso "$file" --output "dist/$filename"
          done
          shopt -u nullglob

          for file in src/*.json; do
            filename=$(basename "$file")
            node -e "const fs=require('fs');fs.writeFileSync('dist/$filename',JSON.stringify(JSON.parse(fs.readFileSync('$file'))))"
          done

          cp -r src/icons dist/

      - name: Compress with 7z
        run: |
          sudo apt-get install -y p7zip-full
          cd dist
          7z a -tzip -mx=9 -mfb=258 -mpass=15 ../correios-wizard.zip .

      - name: Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: assets
          name: "Correios Wizard v${{ steps.version.outputs.version }}"
          body: |
            **Versão:** `${{ steps.version.outputs.version }}`

            Extensão compilada e minificada, pronta para instalação manual em Chrome, Edge ou Firefox.
          files: correios-wizard.zip
          make_latest: true
