name: Deploy Extension

on:
  push:
    branches: [prod]
    paths:
      - '.github/workflows/deploy.yml'
      - 'extension.config.toml'
      - 'src/**'
      - 'scripts/**'
      - 'externs/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install 7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Build and package extensions
        run: pnpm run update-libs && pnpm build-zip

      - name: Rename zip files for release
        run: |
          mv build/cw-chrome.zip correios-wizard-chrome.zip
          mv build/cw-edge.zip correios-wizard-edge.zip
          mv build/cw-firefox.zip correios-wizard-firefox.zip

      - name: Get Version
        id: version
        run: |
          VERSION=$(cat build/version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate Firefox update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const manifest = {
              addons: {
                '@correios-wizard.henriquecoder': {
                  updates: [{
                    version: process.env.VERSION,
                    update_link: 'https://github.com/henrique-coder/correios-wizard/releases/latest/download/correios-wizard-firefox.zip'
                  }]
                }
              }
            };
            fs.writeFileSync('firefox_updates.json', JSON.stringify(manifest));
          "

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'v${{ steps.version.outputs.version }}'
          name: 'Correios Wizard v${{ steps.version.outputs.version }}'
          body: |
            **Versão:** `${{ steps.version.outputs.version }}`

            Extensões compiladas e otimizadas.

            | Arquivo | Navegador |
            |---|---|
            | `correios-wizard-chrome.zip` | Google Chrome |
            | `correios-wizard-edge.zip` | Microsoft Edge |
            | `correios-wizard-firefox.zip` | Mozilla Firefox |
          files: |
            correios-wizard-chrome.zip
            correios-wizard-edge.zip
            correios-wizard-firefox.zip
            firefox_updates.json
          make_latest: true
