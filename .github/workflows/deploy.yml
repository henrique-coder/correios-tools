name: Deploy Extension

on:
  push:
    branches: [prod]
    paths:
      - "src/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate extension files
        run: |
          echo "Validating manifest.json..."
          node -e "JSON.parse(require('fs').readFileSync('src/manifest.json'))"

          echo "Validating JavaScript files..."
          for file in src/*.js; do
            node --check "$file" || exit 1
          done

          echo "All files valid!"

      - name: Install minification tools
        run: npm install -g terser@latest csso-cli@latest html-minifier-terser@latest

      - name: Minify extension files
        run: |
          mkdir -p dist

          for file in src/*.js; do
            filename=$(basename "$file")
            terser "$file" --compress --mangle --output "dist/$filename"
          done

          for file in src/*.css 2>/dev/null; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            csso "$file" --output "dist/$filename"
          done

          for file in src/*.json; do
            filename=$(basename "$file")
            node -e "const fs=require('fs');fs.writeFileSync('dist/$filename',JSON.stringify(JSON.parse(fs.readFileSync('$file'))))"
          done

          cp -r src/icons dist/

      - name: Compress with 7z
        run: |
          sudo apt-get install -y p7zip-full
          mkdir -p public
          cd dist
          7z a -tzip -mx=9 -mfb=258 -mpass=15 ../public/extension.zip .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
