name: Deploy Extension

on:
  push:
    branches: [prod]
    paths:
      - '.github/workflows/deploy.yml'
      - 'extension.config.toml'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate source files
        run: |
          npm i --no-save smol-toml

          echo "Validating extension.config.toml..."
          node -e "
            const fs = require('fs');
            const { parse } = require('smol-toml');
            const raw = fs.readFileSync('extension.config.toml', 'utf8');
            const config = parse(raw);
            if (!config) throw new Error('Invalid TOML format');
          "

          echo "Validating JavaScript files..."
          for file in src/*.js; do
            node --check "$file" || exit 1
          done

          echo "All files valid!"

      - name: Install build tools
        run: npm install -g terser@latest csso-cli@latest

      - name: Generate version
        id: version
        run: |
          SP_DATE=$(TZ=America/Sao_Paulo date +'%Y-%-m-%-d')
          SP_YEAR=$(echo "$SP_DATE" | cut -d'-' -f1)
          SP_MONTH=$(echo "$SP_DATE" | cut -d'-' -f2)
          SP_DAY=$(echo "$SP_DATE" | cut -d'-' -f3)

          TODAY_START=$(TZ=America/Sao_Paulo date -d "$(TZ=America/Sao_Paulo date +%Y-%m-%d) 00:00:00" -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT_COUNT=$(git log --oneline --after="$TODAY_START" | wc -l)
          BUILD_NUMBER=$((COMMIT_COUNT > 0 ? COMMIT_COUNT - 1 : 0))

          VERSION="${SP_YEAR}.${SP_MONTH}.${SP_DAY}.${BUILD_NUMBER}"
          echo "Generated version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download polyfill
        run: |
          curl -fsSL "https://unpkg.com/webextension-polyfill@0.12/dist/browser-polyfill.min.js" \
            -o /tmp/browser-polyfill.min.js
          echo "Polyfill downloaded ($(wc -c < /tmp/browser-polyfill.min.js) bytes)"

      - name: Build and package extensions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const { parse } = require('smol-toml');

            // Parse TOML config
            const raw = fs.readFileSync('extension.config.toml', 'utf8');
            const config = parse(raw);

            // Extract browser overrides and remove from base
            const overrides = config.browser_overrides || {};
            delete config.browser_overrides;

            // Replace version placeholders
            const version = process.env.VERSION;
            config.version = version;

            const browsers = ['chrome', 'edge', 'firefox'];

            for (const browser of browsers) {
              // Deep clone base config
              const manifest = JSON.parse(JSON.stringify(config));

              // Merge browser-specific overrides
              if (overrides[browser]) {
                Object.assign(manifest, overrides[browser]);
              }

              // Write manifest
              const outDir = 'dist/' + browser;
              fs.mkdirSync(outDir, { recursive: true });
              fs.writeFileSync(
                path.join(outDir, 'manifest.json'),
                JSON.stringify(manifest)
              );
            }

            console.log('Manifests generated for: ' + browsers.join(', '));
          "

          # Minify and copy files for each browser
          for browser in chrome edge firefox; do
            dist="dist/$browser"

            # Copy polyfill
            cp /tmp/browser-polyfill.min.js "$dist/"

            # Minify JS files
            for file in src/*.js; do
              filename=$(basename "$file")
              terser "$file" --compress --mangle --output "$dist/$filename"
            done

            # Minify CSS (if any)
            shopt -s nullglob
            for file in src/*.css; do
              filename=$(basename "$file")
              csso "$file" --output "$dist/$filename"
            done
            shopt -u nullglob

            # Copy icons
            cp -r src/icons "$dist/"
          done

          echo "All browser builds ready!"

      - name: Compress with 7z
        run: |
          sudo apt-get install -y p7zip-full > /dev/null 2>&1
          for browser in chrome edge firefox; do
            cd "dist/$browser"
            7z a -tzip -mx=9 -mfb=258 -mpass=15 "../../correios-wizard-${browser}.zip" .
            cd ../..
          done

      - name: Lint Firefox extension
        run: |
          echo "Linting Firefox extension..."
          npx --yes web-ext lint --source-dir dist/firefox

          echo "Firefox extension passed validation!"

      - name: Generate Firefox update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const manifest = {
              addons: {
                '@correios-wizard.henriquecoder': {
                  updates: [{
                    version: process.env.VERSION,
                    update_link: 'https://github.com/henrique-coder/correios-wizard/releases/latest/download/correios-wizard-firefox.zip'
                  }]
                }
              }
            };
            fs.writeFileSync('updates.json', JSON.stringify(manifest));
          "

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'v${{ steps.version.outputs.version }}'
          name: 'Correios Wizard v${{ steps.version.outputs.version }}'
          body: |
            **Versão:** `${{ steps.version.outputs.version }}`

            Extensão compilada e minificada para cada navegador.

            | Arquivo | Navegador |
            |---|---|
            | `correios-wizard-chrome.zip` | Google Chrome |
            | `correios-wizard-edge.zip` | Microsoft Edge |
            | `correios-wizard-firefox.zip` | Mozilla Firefox |
          files: |
            correios-wizard-chrome.zip
            correios-wizard-edge.zip
            correios-wizard-firefox.zip
            updates.json
          make_latest: true
