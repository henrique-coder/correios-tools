name: Deploy Extension

on:
  push:
    branches: [prod]
    paths:
      - '.github/workflows/deploy.yml'
      - 'wxt.config.ts'
      - 'tsconfig.json'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint checks
        run: pnpm run lint

      - name: Clean previous output
        run: rm -rf .output

      - name: Build and package extensions
        run: pnpm run zip

      - name: Validate release artifacts
        run: |
          test -f .output/correios-wizard-chrome.zip
          test -f .output/correios-wizard-edge.zip
          test -f .output/correios-wizard-firefox.zip

      - name: Get Version
        id: version
        run: |
          VERSION=$(node -e "const fs=require('fs');const manifest=JSON.parse(fs.readFileSync('.output/chrome-mv3/manifest.json','utf8'));process.stdout.write(manifest.version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate Firefox update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const manifest = {
              addons: {
                '@correios-wizard.henriquecoder': {
                  updates: [{
                    version: process.env.VERSION,
                    update_link: 'https://github.com/henrique-coder/correios-wizard/releases/latest/download/correios-wizard-firefox.zip'
                  }]
                }
              }
            };
            fs.writeFileSync('firefox_updates.json', JSON.stringify(manifest));
          "

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: 'v${{ steps.version.outputs.version }}'
          name: 'Correios Wizard v${{ steps.version.outputs.version }}'
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            **Versão:** `${{ steps.version.outputs.version }}`

            Extensões compiladas e otimizadas.

            | Arquivo | Navegador |
            |---|---|
            | `correios-wizard-chrome.zip` | Google Chrome |
            | `correios-wizard-edge.zip` | Microsoft Edge |
            | `correios-wizard-firefox.zip` | Mozilla Firefox |
          files: |
            .output/correios-wizard-chrome.zip
            .output/correios-wizard-edge.zip
            .output/correios-wizard-firefox.zip
            firefox_updates.json
          make_latest: true
