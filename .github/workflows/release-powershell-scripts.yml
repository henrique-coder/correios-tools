name: Release PowerShell Scripts

on:
  push:
    branches:
      - prod
    paths:
      - ".github/workflows/release-powershell-scripts.yml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-powershell-scripts
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install PSMinifier
        shell: pwsh
        run: Install-Module PSMinifier -Force -Scope CurrentUser

      - name: Validate Scripts
        shell: pwsh
        run: |
          Write-Host "🔎 Validating PowerShell scripts..."
          $errorCount = 0

          # Only check root scripts folder (extras was removed)
          $scripts = Get-ChildItem -Path scripts -Recurse -Filter "*.ps1"

          foreach ($script in $scripts) {
             $results = Invoke-ScriptAnalyzer -Path $script.FullName -Severity Error
             if ($results) {
               Write-Host "❌ Invalid Script: $($script.Name)"
               $results | Format-Table
               $errorCount++
             }
          }

          if ($errorCount -gt 0) {
            Write-Error "⛔ Validation failed. Release cancelled."
            exit 1
          }

          Write-Host "✅ All scripts are valid."

      - name: Process Scripts
        id: process
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_assets | Out-Null

          $stats = @()
          $latestTimestamp = 0
          $latestModified = "None"

          Write-Host "🔄 Processing scripts..."

          $scripts = Get-ChildItem -Path "scripts" -Filter "*.ps1" -File

          if ($scripts.Count -eq 0) {
            Write-Error "No scripts found!"
            exit 1
          }

          foreach ($script in $scripts) {
            Write-Host "  - Processing $($script.Name)..."

            $content = Get-Content $script.FullName -Raw
            $minifiedBlock = Compress-ScriptBlock -ScriptBlock ([ScriptBlock]::Create($content))
            $minifiedContent = $minifiedBlock.ToString()

            $outName = $script.Name.Replace(".ps1", ".min.ps1")
            $outPath = Join-Path "release_assets" $outName
            [System.IO.File]::WriteAllText($outPath, $minifiedContent, [System.Text.UTF8Encoding]::new($false))

            # Simple size calc
            $sizeBytes = (Get-Item $outPath).Length
            $sizeStr = "$([math]::Round($sizeBytes / 1KB, 2))KB"

            # Git log for timestamp
            # We use git log on the ORIGINAL file
            $ts = git log -1 --format=%ct -- $script.FullName
            if ($ts -match "^\d+$" -and [int64]$ts -gt $latestTimestamp) {
              $latestTimestamp = [int64]$ts
              $latestModified = $script.Name
            }

            $stats += "| ``$outName`` | $sizeStr | ✅ Minified |"
          }

          # Output outputs
          "latest_item=$latestModified" >> $env:GITHUB_OUTPUT

          # Prepare Body
          "body<<EOF" >> $env:GITHUB_OUTPUT
          "### 🚀 Release Information" >> $env:GITHUB_OUTPUT
          "" >> $env:GITHUB_OUTPUT
          "**Latest Update:** ``$latestModified``" >> $env:GITHUB_OUTPUT
          "" >> $env:GITHUB_OUTPUT
          "| Script | Size | Status |" >> $env:GITHUB_OUTPUT
          "| :--- | :--- | :--- |" >> $env:GITHUB_OUTPUT
          $stats | ForEach-Object { $_ >> $env:GITHUB_OUTPUT }
          "" >> $env:GITHUB_OUTPUT
          "**Commit:** [``${{ github.sha }}``](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Delete Existing Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete minified-scripts --cleanup-tag -y 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: minified-scripts
          name: "Script Update: ${{ steps.process.outputs.latest_item }}"
          body: ${{ steps.process.outputs.body }}
          files: release_assets/*.ps1
          draft: false
          prerelease: false
          make_latest: true
